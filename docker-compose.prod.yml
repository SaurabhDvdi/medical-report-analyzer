version: '3.8'

services:
  # Nginx Reverse Proxy (Public Entrypoint)
  nginx:
    image: nginx:alpine
    container_name: medical_reports_nginx_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - prod-network

  # Production FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical_reports_backend_prod
    restart: always
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-production-domain.com}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com}
    volumes:
      - prod_uploads_data:/app/uploads
      - prod_charts_data:/app/charts
    networks:
      - prod-network

  # Production Background Worker (OCR & Medical Analysis)
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: medical_reports_worker_prod
    restart: always
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com}
    volumes:
      - prod_uploads_data:/app/uploads
      - prod_charts_data:/app/charts
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge

volumes:
  prod_uploads_data:
  prod_charts_data:
