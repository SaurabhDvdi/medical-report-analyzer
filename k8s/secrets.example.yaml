apiVersion: v1
kind: Secret
metadata:
  name: medical-analyzer-secrets
  namespace: medical-analyzer
  labels:
    app.kubernetes.io/name: medical-report-analyzer
type: Opaque
stringData:
  # MySQL Credentials
  DB_PASSWORD: "medical_secure_password_123!"
  MYSQL_ROOT_PASSWORD: "root_secure_password_123!"

  # JWT Symmetric Signing Key (must be minimum 32 random characters in production)
  SECRET_KEY: "change-this-to-a-secure-random-256bit-secret-in-production"

  # Production Cloud LLM API Key (Required for production LLM_PROVIDER=groq)
  GROQ_API_KEY: "gsk_your_groq_api_key_here"
  GEMINI_API_KEY: ""
  TYPESAFE_API_KEY: ""
