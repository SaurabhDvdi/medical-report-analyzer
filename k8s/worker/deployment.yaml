apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: medical-analyzer
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: clinical-intelligence-platform
    app.kubernetes.io/component: background-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: clinical-intelligence-platform
        app.kubernetes.io/component: background-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: medical-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - configMapRef:
                name: medical-analyzer-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: SECRET_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: TYPESAFE_API_KEY
                  optional: true
            - name: DATABASE_URL
              value: "mysql+pymysql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          volumeMounts:
            - name: reports-storage
              mountPath: /app/uploads
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
      volumes:
        - name: reports-storage
          persistentVolumeClaim:
            claimName: reports-pvc
