apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: medical-analyzer
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: clinical-intelligence-platform
    app.kubernetes.io/component: queue-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: clinical-intelligence-platform
        app.kubernetes.io/component: queue-broker
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
