apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-analyzer-ingress
  namespace: medical-analyzer
  labels:
    app.kubernetes.io/name: medical-analyzer-ingress
    app.kubernetes.io/part-of: clinical-intelligence-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          # AI SSE Streaming Route - Explicitly disabling buffering and extending timeout
          - path: /api/ai/chat/stream
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # General Backend API Routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Health & Probes
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Frontend SPA Static Assets and Client Routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
