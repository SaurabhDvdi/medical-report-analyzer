apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: medical-analyzer
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: clinical-intelligence-platform
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: clinical-intelligence-platform
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: medical-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
