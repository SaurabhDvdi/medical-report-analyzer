apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medical-analyzer
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: clinical-intelligence-platform
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: clinical-intelligence-platform
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: medical-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: medical-analyzer-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: SECRET_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medical-analyzer-secrets
                  key: TYPESAFE_API_KEY
                  optional: true
            - name: DATABASE_URL
              value: "mysql+pymysql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          volumeMounts:
            - name: reports-storage
              mountPath: /app/uploads
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: reports-storage
          persistentVolumeClaim:
            claimName: reports-pvc
